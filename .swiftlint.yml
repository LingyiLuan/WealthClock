disabled_rules:
  - trailing_whitespace
  - line_length
  # AGENTS.md §4.2 要求未校准数字必须标 TODO(calibrate),与 todo 规则冲突。
  - todo
identifier_name:
  min_length: 1
nesting:
  type_level: 2
cyclomatic_complexity:
  ignores_case_statements: true  # 枚举步骤机大量 switch,case 不计复杂度
inclusive_language:
  override_allowed_terms:
    - masterPlus  # BRIEF §3.1 逐字规格的公开 API 枚举值(硕士及以上)
opt_in_rules:
  - force_unwrapping
  - empty_count
  - closure_spacing
excluded:
  - .build
  - DerivedData
  - Packages/*/.build
force_unwrapping:
  severity: error
custom_rules:
  no_networking:
    name: "No networking in v1"
    regex: "(URLSession|Alamofire|import\\s+Network|NWConnection)"
    message: "v1 is fully offline (AGENTS.md §7.1)."
    severity: error
  no_birthdate_in_engine:
    name: "birthDate must not enter the engine"
    included: "Packages/FreedomEngine/Sources/.*"
    regex: "birthDate"
    match_kinds: identifier
    message: "birthDate is omen-layer only (AGENTS.md §7.6). Only Profile.swift may declare it."
    severity: error
    excluded: "Packages/FreedomEngine/Sources/FreedomEngine/Profile.swift"
