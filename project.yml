name: WealthClock
options:
  projectFormat: xcode15_3
  developmentLanguage: zh-Hans
  bundleIdPrefix: app.wealthclock
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  FreedomEngine:
    path: Packages/FreedomEngine
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "MQN29WDQ6Y"
    CODE_SIGN_STYLE: Automatic
targets:
  WealthClock:
    type: application
    platform: iOS
    sources:
      - path: WealthClock
        excludes:
          - "**/README.md"
          # 本机 Xcode 15.4 + macOS 26 的 actool 无法启动 AssetCatalogSimulatorAgent(已试清缓存/重启服务/设备目标)。
          # 图标已生成入库;在能跑新 Xcode 的机器(CI / 上架机)删掉下面这行即可编入。
          - "**/Assets.xcassets"
    dependencies:
      - package: FreedomEngine
    info:
      path: WealthClock/Info.plist
      properties:
        CFBundleDisplayName: WealthClock
        CFBundleDevelopmentRegion: zh-Hans
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts: [MaShanZheng-Regular.ttf]
        NSPhotoLibraryAddUsageDescription: "保存你的汇票到相册。"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.wealthclock.ios
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # SwiftLint 构建阶段需要读仓库根的 .swiftlint.yml 与全部源码,无法在脚本沙盒下声明输入。
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: SwiftLint
        script: |
          if which swiftlint >/dev/null; then swiftlint --strict --config "${SRCROOT}/.swiftlint.yml"; else echo "warning: swiftlint not installed"; fi
        basedOnDependencyAnalysis: false
  WealthClockTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WealthClockTests
    dependencies:
      - target: WealthClock
      - sdk: StoreKitTest.framework
schemes:
  WealthClock:
    build:
      targets:
        WealthClock: all
        WealthClockTests: [test]
    run:
      storeKitConfiguration: WealthClock/Resources/WealthClock.storekit
    test:
      targets: [WealthClockTests]
      gatherCoverageData: true
